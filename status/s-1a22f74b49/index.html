:root{
  --bg:#202328; --surface:#292d33; --steel:#68717a; --milk:#e8ebee; --mist:#aebbc7;
  --hair:rgba(232,235,238,.14); --bad:#f06b60; --ok:#f2c94c; --good:#5ccf8b;
  --font:'Manrope',"Helvetica Neue",Arial,system-ui,sans-serif;
  --serif:"Cormorant Garamond","Didot","Bodoni 72",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--milk);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{background-image:radial-gradient(ellipse 80% 40% at 90% -10%,rgba(174,187,199,.14),transparent 60%);min-height:100vh;font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--hair)}
.duo{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.duo img{height:26px;width:auto;display:block}
.duo img.brandlogo{height:22px}
.duo .x{color:var(--steel);font-size:18px;font-weight:300}
.wordmark{font-family:var(--serif);font-size:20px;letter-spacing:.28em;font-weight:500;line-height:1;white-space:nowrap}
.wordmark small{display:block;font-family:var(--font);font-size:9px;letter-spacing:.5em;color:var(--mist);margin-top:5px;font-weight:600}
.updated{font-size:12px;color:var(--mist);text-align:right;line-height:16px}
.updated b{display:block;color:var(--milk);font-weight:600}
.live{display:inline-flex;align-items:center;gap:6px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 rgba(92,207,139,.6);animation:pulse 2s infinite}
h1{margin:6px 0 0;font-weight:300;font-size:clamp(30px,6vw,46px);line-height:1.08;letter-spacing:-.015em;text-wrap:balance}
.lead{margin:8px 0 0;color:var(--mist);font-size:15px;line-height:23px;max-width:60ch}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:20px;min-width:0}
.card h2{margin:0;font-size:15px;line-height:20px;font-weight:600}
.note{margin:4px 0 16px;font-size:12px;line-height:17px;color:var(--mist)}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mist)}
/* конвеєр */
.pipe{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pipe svg.thread{position:absolute;left:0;top:50%;width:100%;height:4px;transform:translateY(-50%);overflow:visible;pointer-events:none;z-index:0}
.stage{position:relative;z-index:1;background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.stage::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--c)}
.stage .lbl{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mist);line-height:16px}
.stage .lbl i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.stage .num{font-weight:300;font-size:clamp(34px,6vw,48px);line-height:1;letter-spacing:-.02em}
.stage .num small{font-size:14px;color:var(--mist);letter-spacing:0;margin-left:4px}
.stage .sub{font-size:12px;color:var(--mist);line-height:16px}
@media (max-width:640px){.pipe{grid-template-columns:1fr}.pipe svg.thread{display:none}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,21rem),1fr));gap:12px}
/* останній день */
.today-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.05);font-size:13px}
.chip b{font-weight:600}
.chip svg{width:14px;height:14px}
/* кільце */
.quality{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.ring{width:170px;height:170px;flex:none}
.kv{display:flex;flex-direction:column;gap:12px;flex:1;min-width:10rem}
.kv div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--hair);padding-bottom:10px;font-size:13px;color:var(--mist)}
.kv div:last-child{border-bottom:0}
.kv b{color:var(--milk);font-weight:600;font-size:15px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.03em;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.06);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.c-good{color:var(--good)}.c-ok{color:var(--ok)}.c-bad{color:var(--bad)}.c-milk{color:var(--milk)}
/* графік */
.chart{position:relative;min-height:230px}
.chart svg text{font-family:var(--font);font-size:11px;fill:var(--mist)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mist);margin:-6px 0 12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px}
.tip{position:absolute;pointer-events:none;background:#16181c;border:1px solid var(--hair);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.35);padding:6px 10px;font-size:12px;line-height:17px;white-space:nowrap;z-index:3}
.tip .d{color:var(--mist)}
/* таблиця */
.tablewrap{overflow-x:auto;margin-inline:-4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mist);font-weight:400;text-align:right;padding:8px 10px;border-bottom:1px solid var(--hair);white-space:nowrap}
td{text-align:right;padding:12px 10px;border-bottom:1px solid var(--hair);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td:first-child{white-space:normal;min-width:12rem;font-weight:600;line-height:19px}
tr:last-child td{border-bottom:0}
.prog{width:90px;height:6px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden;display:inline-block;vertical-align:middle}
.prog i{display:block;height:100%;border-radius:3px;background:var(--good);width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.toggle{appearance:none;font:inherit;font-size:13px;font-weight:600;color:var(--milk);background:transparent;border:1px solid var(--steel);border-radius:999px;padding:10px 16px;min-height:40px;margin-top:14px;cursor:pointer}
.toggle:hover{border-color:var(--mist)}
.toggle:focus-visible{outline:2px solid var(--milk);outline-offset:2px}
/* стрічка */
.feed{display:flex;flex-direction:column;gap:18px}
.fday{display:grid;grid-template-columns:64px 1fr;gap:14px}
.fdate{font-size:13px;font-weight:600;line-height:20px}
.fdate small{display:block;font-weight:400;color:var(--mist);font-size:11px}
.fitems{display:flex;flex-direction:column;gap:8px;border-left:1px solid var(--hair);padding-left:14px}
.fitem{display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:start;font-size:13px;line-height:19px}
.fitem svg{width:16px;height:16px;margin-top:2px}
.fitem span{color:var(--mist)}
.fitem b{font-weight:600;white-space:nowrap}
footer{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-top:18px;border-top:1px solid var(--hair);font-size:12px;color:var(--mist);line-height:17px}
footer .wm{letter-spacing:.32em;font-weight:600;color:var(--milk);font-size:11px}
/* замок */
.lock{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;color:var(--mist);font-size:14px;line-height:21px}
.lock img{height:34px}
.lock p{max-width:34ch;margin:0}
.in{animation:fade .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(92,207,139,.55)}70%{box-shadow:0 0 0 8px rgba(92,207,139,0)}100%{box-shadow:0 0 0 0 rgba(92,207,139,0)}}
@keyframes flow{to{stroke-dashoffset:-48}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
(async function () {
  const LOGO = document.querySelector('#lock img').src;
  const msg = document.getElementById('lock-msg');
  const fail = t => { msg.textContent = t; };
  const b64 = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/').padEnd(Math.ceil(s.length / 4) * 4, '=')), c => c.charCodeAt(0));
  const key = new URLSearchParams(location.hash.slice(1)).get('k');
  if (!key) return fail('Ця сторінка відкривається лише за персональним посиланням від Brevis. Перевірте, що посилання скопійоване повністю.');
  let data;
  try {
    const raw = b64(document.getElementById('payload').textContent.trim());
    const k = await crypto.subtle.importKey('raw', b64(key), 'AES-GCM', false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: raw.slice(0, 12)}, k, raw.slice(12));
    data = JSON.parse(new TextDecoder().decode(plain));
  } catch (e) { return fail('Посилання недійсне або застаріле. Попросіть у Brevis нове посилання.'); }
  render(data, LOGO);
})();

function render(D, LOGO) {
  const nf = new Intl.NumberFormat('uk-UA');
  const pf = (v, d = 1) => new Intl.NumberFormat('uk-UA', {style: 'percent', maximumFractionDigits: d, minimumFractionDigits: d}).format(v);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dd = s => s.slice(8, 10) + '.' + s.slice(5, 7);
  const WD = ['нд', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
  const wd = s => WD[new Date(s + 'T00:00:00Z').getUTCDay()];
  const el = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (k === 'class') e.className = v; else if (k === 'style') e.style.cssText = v; else e.setAttribute(k, v); } kids.flat().forEach(c => e.append(c instanceof Node ? c : document.createTextNode(c))); return e; };
  const NS = 'http://www.w3.org/2000/svg';
  const sv = (tag, attrs = {}) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); return e; };
  const ICON = {
    in: '<path d="M8 2v9M4 7l4 4 4-4M3 14h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>',
    emb: '<path d="M2 12c2-5 4-5 6 0s4 5 6 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="4" r="1.6" fill="currentColor"/>',
    ship: '<path d="M2 8h9M8 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 3v10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>'
  };
  const TO = {in: 0, emb: 1, ship: 2}, byT = a => a.slice().sort((x, y) => TO[x.t] - TO[y.t]);
  const icon = (t, cls) => { const s = sv('svg', {viewBox: '0 0 16 16', 'aria-hidden': 'true', class: cls}); s.innerHTML = ICON[t]; return s; };
  const COL = {queue: 'var(--ok)', ready: 'var(--good)', shipped: 'var(--milk)'};
  const STL = {queue: ['c-ok', 'в роботі'], ready: ['c-good', 'готово до відправки'], shipped: ['c-milk', 'відправлено']};
  const count = (node, to, fmt = v => nf.format(Math.round(v)), ms = 1100) => {
    if (reduce) { node.textContent = fmt(to); return; }
    const t0 = performance.now();
    const step = t => { const p = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - p, 3); node.textContent = fmt(to * e); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  };

  const app = document.getElementById('app'); app.replaceChildren();
  const asof = D.asof, M = D.month, def = M.embroidered ? M.defects / M.embroidered : 0;
  const defSt = def <= 0.005 ? 'good' : def <= 0.01 ? 'ok' : 'bad';

  // шапка
  app.append(el('header', {class: 'in'},
    el('div', {class: 'duo'}, el('img', {src: LOGO, alt: 'Brevis'}), el('span', {class: 'x'}, '×'),
      D.logo ? el('img', {src: D.logo, alt: D.brand, class: 'brandlogo'}) : el('div', {class: 'wordmark'}, D.brand.replace(' STUDIO', ''), el('small', {}, 'STUDIO'))),
    el('div', {class: 'updated'}, el('b', {}, el('span', {class: 'live'}, el('i'), 'Оновлено ' + dd(asof) + '.' + asof.slice(0, 4))), 'Статус замовлень у вишивці')));
  app.append(el('section', {class: 'in', style: 'animation-delay:.05s'},
    el('div', {class: 'eyebrow'}, 'Brevis · промислова вишивка'),
    el('h1', {}, 'Ваші замовлення: що прийнято, що вишивається і що вже поїхало'),
    el('p', {class: 'lead'}, 'Сторінка оновлюється за даними нашого виробничого журналу. Кількості — у штуках крою.')));

  // конвеєр
  const pipe = el('section', {class: 'pipe in', style: 'animation-delay:.1s', 'aria-label': 'Етапи замовлень'});
  const thr = sv('svg', {class: 'thread', viewBox: '0 0 100 4', preserveAspectRatio: 'none'});
  thr.append(sv('line', {x1: 0, x2: 100, y1: 2, y2: 2, stroke: 'rgba(232,235,238,.25)', 'stroke-width': 1, 'vector-effect': 'non-scaling-stroke'}));
  const flow = sv('line', {x1: 0, x2: 100, y1: 2, y2: 2, stroke: '#e8ebee', 'stroke-width': 2, 'stroke-dasharray': '10 38', 'vector-effect': 'non-scaling-stroke', style: 'filter:drop-shadow(0 0 4px rgba(232,235,238,.8));animation:flow 1.6s linear infinite'});
  thr.append(flow); pipe.append(thr);
  const stages = [
    ['queue', 'На приході · чекає вишивки', D.now.queue, 'крій уже у нас'],
    ['ready', 'Вишито · готується до відправки', D.now.ready, 'чекає на відправку'],
    ['shipped', 'Відправлено у жовтні', M.shipped, 'поїхало до вас']
  ];
  stages.forEach(([k, l, v, s]) => {
    const n = el('span', {}, '0');
    pipe.append(el('div', {class: 'stage', style: '--c:' + COL[k]}, el('div', {class: 'lbl'}, el('i'), l), el('div', {class: 'num'}, n, el('small', {}, 'шт')), el('div', {class: 'sub'}, s)));
    count(n, v);
  });
  app.append(pipe);

  // останній день + якість
  const last = D.days[D.days.length - 1];
  const todayCard = el('div', {class: 'card in', style: 'animation-delay:.15s'},
    el('h2', {}, 'Останній робочий день · ' + wd(last.day) + ', ' + dd(last.day)),
    el('p', {class: 'note'}, 'Що зробили за день.'),
    el('div', {class: 'today-chips'},
      el('span', {class: 'chip c-ok'}, icon('in'), el('span', {class: 'c-milk'}, 'прийнято ', el('b', {}, nf.format(last.in)))),
      el('span', {class: 'chip c-milk'}, icon('emb'), 'вишито ', el('b', {}, nf.format(last.emb))),
      el('span', {class: 'chip c-good'}, icon('ship'), el('span', {class: 'c-milk'}, 'відправлено ', el('b', {}, nf.format(last.ship))))));
  const tl = el('div', {class: 'fitems', style: 'border-left:0;padding-left:0'});
  byT(last.items).forEach(it => tl.append(feedItem(it)));
  todayCard.append(tl);

  const ring = sv('svg', {viewBox: '0 0 170 170', class: 'ring', role: 'img', 'aria-label': 'Частка виробів без браку'});
  const R = 72, C = 2 * Math.PI * R, okShare = 1 - def;
  ring.append(sv('circle', {cx: 85, cy: 85, r: R, fill: 'none', stroke: 'rgba(255,255,255,.07)', 'stroke-width': 12}));
  const col = getComputedStyle(document.documentElement).getPropertyValue('--' + defSt).trim();
  const arc = sv('circle', {cx: 85, cy: 85, r: R, fill: 'none', stroke: col, 'stroke-width': 12, 'stroke-linecap': 'round', transform: 'rotate(-90 85 85)', 'stroke-dasharray': C, 'stroke-dashoffset': C, style: `filter:drop-shadow(0 0 6px ${col}99);transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)`});
  ring.append(arc);
  const big = sv('text', {x: 85, y: 88, 'text-anchor': 'middle', 'font-size': 30, 'font-weight': 300, fill: '#e8ebee', 'font-family': 'Manrope, Arial, sans-serif'});
  const small = sv('text', {x: 85, y: 110, 'text-anchor': 'middle', 'font-size': 11, fill: '#aebbc7', 'font-family': 'Manrope, Arial, sans-serif'}); small.textContent = 'без браку';
  ring.append(big, small);
  requestAnimationFrame(() => requestAnimationFrame(() => arc.setAttribute('stroke-dashoffset', C * (1 - okShare))));
  count(big, okShare * 100, v => v.toFixed(1).replace('.', ',') + '%');
  const qualCard = el('div', {class: 'card in', style: 'animation-delay:.2s'},
    el('h2', {}, 'Якість · ' + M.label.toLowerCase()),
    el('p', {class: 'note'}, 'Частка виробів, вишитих без браку.'),
    el('div', {class: 'quality'}, ring, el('div', {class: 'kv'},
      el('div', {}, 'Прийнято крою', el('b', {}, nf.format(M.received))),
      el('div', {}, 'Вишито', el('b', {}, nf.format(M.embroidered))),
      el('div', {}, 'Відправлено', el('b', {}, nf.format(M.shipped))),
      el('div', {}, 'Брак', el('span', {class: 'pill c-' + defSt}, el('i'), nf.format(M.defects) + ' шт · ' + pf(def, 2))))));
  app.append(el('section', {class: 'grid'}, todayCard, qualCard));

  // графік по днях
  const chartBox = el('div', {class: 'chart', id: 'chart'});
  app.append(el('section', {class: 'card in', style: 'animation-delay:.25s'},
    el('h2', {}, 'Вишито і відправлено по днях'),
    el('p', {class: 'note'}, M.label + '. Торкніться стовпця, щоб побачити цифри.'),
    el('div', {class: 'legend'}, el('span', {}, el('i', {style: 'background:var(--milk)'}), 'вишито'), el('span', {}, el('i', {style: 'background:var(--good)'}), 'відправлено')),
    chartBox));
  const monthDays = D.days.filter(d => d.day.slice(0, 7) === asof.slice(0, 7));
  let drawn = false;
  const drawChart = () => {
    chartBox.replaceChildren();
    const W = Math.max(300, chartBox.clientWidth), H = 230, m = {t: 12, r: 4, b: 26, l: 40};
    const max = Math.max(1, ...monthDays.map(d => Math.max(d.emb, d.ship)));
    const nice = Math.pow(10, Math.floor(Math.log10(max))), top = Math.ceil(max / nice) * nice;
    const y = v => H - m.b - (v / top) * (H - m.t - m.b);
    const svg = sv('svg', {viewBox: `0 0 ${W} ${H}`, width: '100%'});
    for (let i = 0; i <= 4; i++) { const v = top * i / 4; svg.append(sv('line', {x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), stroke: 'rgba(232,235,238,.1)'})); const t = sv('text', {x: m.l - 8, y: y(v) + 4, 'text-anchor': 'end'}); t.textContent = nf.format(v); svg.append(t); }
    const band = (W - m.l - m.r) / monthDays.length, bw = Math.max(3, Math.min(11, band * 0.32));
    const tip = el('div', {class: 'tip'}); tip.hidden = true;
    monthDays.forEach((d, i) => {
      const cx = m.l + band * i + band / 2;
      const g = sv('g', {style: 'cursor:pointer'});
      g.append(sv('rect', {x: cx - band / 2, y: m.t, width: band, height: H - m.t - m.b, fill: 'transparent'}));
      [['emb', '#e8ebee', -bw / 2 - 1], ['ship', '#5ccf8b', bw / 2 + 1]].forEach(([k, c, off]) => {
        const h = y(0) - y(d[k]);
        const r = sv('rect', {x: cx + off - bw / 2, width: bw, rx: 2, fill: c, y: y(0), height: 0});
        if (!drawn && !reduce) { r.style.transition = `y .9s cubic-bezier(.2,.8,.2,1) ${i * 30}ms, height .9s cubic-bezier(.2,.8,.2,1) ${i * 30}ms`; requestAnimationFrame(() => requestAnimationFrame(() => { r.setAttribute('y', y(d[k])); r.setAttribute('height', h); })); }
        else { r.setAttribute('y', y(d[k])); r.setAttribute('height', h); }
        g.append(r);
      });
      if (monthDays.length < 16 || i % 2 === 0) { const t = sv('text', {x: cx, y: H - 8, 'text-anchor': 'middle'}); t.textContent = dd(d.day); svg.append(t); }
      g.addEventListener('pointerenter', () => {
        tip.replaceChildren(el('div', {class: 'd'}, wd(d.day) + ', ' + dd(d.day)), el('div', {}, 'вишито ' + nf.format(d.emb)), el('div', {class: 'c-good'}, 'відправлено ' + nf.format(d.ship)), d.in ? el('div', {class: 'c-ok'}, 'прийнято ' + nf.format(d.in)) : '');
        tip.hidden = false; const k = chartBox.clientWidth / W;
        tip.style.left = Math.max(0, Math.min(chartBox.clientWidth - tip.offsetWidth, cx * k - tip.offsetWidth / 2)) + 'px';
        tip.style.top = Math.max(0, y(Math.max(d.emb, d.ship)) * k - tip.offsetHeight - 10) + 'px';
      });
      g.addEventListener('pointerleave', () => { tip.hidden = true; });
      svg.append(g);
    });
    chartBox.append(svg, tip); drawn = true;
  };
  drawChart();
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(drawChart, 150); });

  // моделі
  const order = {queue: 0, ready: 1, shipped: 2};
  const prods = D.products.slice().sort((a, b) => order[a.status] - order[b.status] || (b.last_ship || b.last_emb || b.first_in || '').localeCompare(a.last_ship || a.last_emb || a.first_in || ''));
  const tbody = el('tbody');
  const active = prods.filter(p => p.status !== 'shipped'), rest = prods.filter(p => p.status === 'shipped');
  const row = p => {
    const done = p.received ? Math.min(1, p.shipped / p.received) : (p.shipped ? 1 : 0);
    const bar = el('i'); requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.width = (done * 100) + '%'; }));
    const [cls, lbl] = STL[p.status];
    return el('tr', {}, el('td', {}, p.name), el('td', {}, p.received ? nf.format(p.received) : '—'), el('td', {}, nf.format(p.embroidered)), el('td', {}, nf.format(p.shipped)),
      el('td', {}, el('span', {class: 'prog', title: pf(done, 0)}, bar)), el('td', {}, el('span', {class: 'pill ' + cls}, el('i'), lbl)));
  };
  const SHOW = 8;
  const fill = all => { tbody.replaceChildren(...active.map(row), ...(all ? rest : rest.slice(0, Math.max(0, SHOW - active.length))).map(row)); };
  fill(false);
  const tog = el('button', {class: 'toggle', type: 'button'}, 'Показати всі моделі (' + prods.length + ')');
  let all = false; tog.addEventListener('click', () => { all = !all; fill(all); tog.textContent = all ? 'Згорнути' : 'Показати всі моделі (' + prods.length + ')'; });
  app.append(el('section', {class: 'card in', style: 'animation-delay:.3s'},
    el('h2', {}, 'Моделі'), el('p', {class: 'note'}, 'Спершу те, що зараз у роботі. Смужка — яка частина прийнятого крою вже відправлена.'),
    el('div', {class: 'tablewrap'}, el('table', {}, el('thead', {}, el('tr', {}, ...['Модель', 'Прийнято', 'Вишито', 'Відправлено', 'Готовність', 'Статус'].map(h => el('th', {}, h)))), tbody)), tog));

  // стрічка подій
  function feedItem(it) {
    const map = {in: ['c-ok', 'прийнято'], emb: ['c-milk', 'вишито'], ship: ['c-good', 'відправлено']}[it.t];
    return el('div', {class: 'fitem'}, icon(it.t, map[0]), el('div', {}, el('span', {}, map[1] + ' · '), it.p), el('b', {}, nf.format(it.q) + ' шт'));
  }
  const feed = el('div', {class: 'feed'});
  D.days.slice(-10).reverse().forEach(d => {
    const items = el('div', {class: 'fitems'}); byT(d.items).forEach(it => items.append(feedItem(it)));
    feed.append(el('div', {class: 'fday'}, el('div', {class: 'fdate'}, dd(d.day), el('small', {}, wd(d.day))), items));
  });
  app.append(el('section', {class: 'card in', style: 'animation-delay:.35s'}, el('h2', {}, 'Стрічка подій'), el('p', {class: 'note'}, 'Останні 10 робочих днів.'), feed));

  app.append(el('footer', {}, el('span', {}, 'Дані — з виробничого журналу Brevis на ' + dd(asof) + '.' + asof.slice(0, 4) + '. Якщо цифри не збігаються з вашими, напишіть своєму менеджеру Brevis.'), el('span', {class: 'wm'}, 'BREVIS · ЛЬВІВ')));
}
</script>
</body>
</html>
