  --sizebar:rgba(255,255,255,.94); --on-bg:#101c2a; --on-ink:#fff; --accent:#3678e3; --tip-bg:#101c2a; --tip-ink:#fff; --tip-mut:#aab6c3; --emb:#101c2a; --total-rule:#101c2a;
  --green:#2e9e5b; --amber:#e8a33c; --amber-ink:#a8690f; --red:#cc3b31;
  --head:'Montserrat',"Helvetica Neue",Arial,sans-serif; --body:'IBM Plex Sans',"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased}
body{font-variant-numeric:tabular-nums}
.in-wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* обкладинка */
.cover{position:relative;overflow:hidden;background:var(--cover-bg);color:var(--cover-ink);padding-top:calc(22px + env(safe-area-inset-top,0px));border-bottom:6px solid var(--cover-rule)}
.cover .in-wrap{position:relative;z-index:1;padding-bottom:34px;display:flex;flex-direction:column;gap:18px}
.cover .wm{position:absolute;right:-60px;bottom:-70px;width:min(520px,70vw);opacity:.07;z-index:0;pointer-events:none}
.logos{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.logos .bv{height:24px}.logos .br{height:26px;max-width:58vw;object-fit:contain}
.eyebrow{font-family:var(--head);font-weight:600;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}
.cover h1{font-family:var(--head);font-weight:600;font-size:clamp(34px,7vw,60px);line-height:1.05;margin:0;letter-spacing:-.01em}
.cover .sub{margin:0;color:var(--cover-sub);font-size:15px;line-height:22px;max-width:62ch}
.stats{display:flex;gap:clamp(18px,5vw,48px);flex-wrap:wrap;margin-top:6px}
.stat b{display:block;font-family:var(--head);font-weight:600;font-size:clamp(24px,4.4vw,34px);line-height:1.1}
.stat span{font-size:12px;color:var(--cover-mut)}
.asof{align-self:flex-start;background:var(--asof-bg);color:var(--asof-ink);font-family:var(--head);font-weight:600;font-size:12px;padding:7px 14px;border-radius:999px}
/* розміри */
.sizebar{position:sticky;top:0;z-index:5;background:var(--sizebar);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.sizebar .in-wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px}
.sizebar .lbl{font-family:var(--head);font-weight:600;font-size:12px;color:var(--ink);margin-right:2px}
.sz{appearance:none;font-family:var(--head);font-weight:600;font-size:13px;min-width:44px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);cursor:pointer;transition:all .2s}
.sz:hover{border-color:var(--accent)}
.sz[aria-pressed=true]{background:var(--on-bg);border-color:var(--on-bg);color:var(--on-ink)}
.sz.soon{color:var(--faint)}
.sz:focus-visible,.tab:focus-visible,.more:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.sizenote{flex-basis:100%;font-size:12px;color:var(--muted);line-height:17px;margin:0}
.sizenote.flash{color:var(--blue)}
/* слайди */
main{padding-bottom:40px}
.slide{padding:38px 0 6px;border-bottom:1px solid var(--line)}
.slide:last-of-type{border-bottom:0}
.slide h2{font-family:var(--head);font-weight:600;font-size:clamp(22px,3.6vw,30px);line-height:1.15;color:var(--ink);margin:8px 0 4px}
.slide .lead{margin:0 0 20px;color:var(--muted);font-size:13px;line-height:19px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,13rem),1fr));gap:12px}
.kpi{background:var(--surface);border-radius:10px;padding:16px 18px;border-top:3px solid var(--c)}
.kpi .t{font-family:var(--head);font-weight:600;font-size:13px;color:var(--ink)}
.kpi .v{font-family:var(--head);font-weight:600;font-size:clamp(34px,5vw,46px);line-height:1.1;color:var(--ci,var(--c));margin:6px 0 2px}
.kpi .s{font-size:12px;color:var(--muted);line-height:17px}
.stack{display:flex;height:30px;border-radius:6px;overflow:hidden;margin:22px 0 10px;background:var(--surface)}
.stack i{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:600;font-style:normal;width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1);white-space:nowrap;overflow:hidden}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:2px;display:inline-block;background:var(--c)}
.legend b{color:var(--ink)}
.summary{margin-top:18px;background:var(--summary);border-radius:10px;padding:14px 16px;font-size:14px;line-height:21px;color:var(--ink);display:flex;gap:10px}
.summary svg{flex:none;margin-top:2px}
/* донат */
.state{display:grid;grid-template-columns:minmax(0,260px) 1fr;gap:28px;align-items:start}
.state .donut{position:sticky;top:76px}
.donut{width:100%;max-width:260px;aspect-ratio:1}
.rows{display:flex;flex-direction:column}
.rowx{display:grid;grid-template-columns:12px 1fr auto 56px;gap:12px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line)}
.rowx:last-child{border-bottom:0}
.rowx .n{font-family:var(--head);font-weight:600;font-size:14px;color:var(--ink)}
.rowx .d{font-size:12px;color:var(--muted);margin-top:2px}
.rowx .q{font-family:var(--head);font-weight:600;font-size:22px;color:var(--ink);text-align:right}
.rowx .p{font-size:12px;color:var(--muted);text-align:right}
.rowx{appearance:none;font:inherit;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px;padding:12px 8px;transition:background .2s,opacity .25s}
.rowx:hover,.rowx.on{background:var(--hover)}
.rowx.dim{opacity:.45}
.rowx:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.detail{margin-top:12px;border-left:3px solid var(--c);background:var(--panel);border-radius:0 10px 10px 0;padding:12px 14px;display:flex;flex-direction:column;gap:8px;animation:dIn .35s cubic-bezier(.2,.8,.2,1)}
.detail .dh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px}
.detail .dh b{font-family:var(--head);font-weight:600;color:var(--ink)}
.detail .dh span{color:var(--muted)}
.di{display:grid;grid-template-columns:minmax(0,1fr) 70px auto;gap:10px;align-items:center;font-size:13px}
.di .dn{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.di .db{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.di .db i{display:block;height:100%;width:0;background:var(--c);border-radius:3px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.di b{font-family:var(--head);font-weight:600;color:var(--ink);min-width:3ch;text-align:right}
.dmore{font-size:12px;color:var(--muted)}
.dclose{appearance:none;align-self:flex-start;font-family:var(--head);font-weight:600;font-size:12px;min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);cursor:pointer}
@keyframes dIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.donut circle[role=button]:focus-visible{stroke-width:36}
@media (max-width:640px){.state{grid-template-columns:1fr}.donut{margin:0 auto;max-width:220px}.state .donut{position:static}}
/* таблиця */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{appearance:none;font-family:var(--head);font-weight:600;font-size:12px;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);cursor:pointer}
.tab[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-ink)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
th{position:sticky;top:0;background:var(--th);font-family:var(--head);font-weight:600;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:right;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th .dot{margin-right:6px;vertical-align:0}
td{text-align:right;padding:12px;border-bottom:1px solid var(--line);white-space:nowrap;color:var(--ink)}
th:first-child,td:first-child{text-align:left}
td:first-child{white-space:normal;font-weight:500;min-width:13rem;line-height:19px}
td:first-child small{display:block;color:var(--muted);font-size:11px;font-weight:400}
tr.total td{background:var(--total);font-family:var(--head);font-weight:600;border-bottom:2px solid var(--total-rule)}
td.z{color:var(--zero)}
td.g{color:var(--green);font-weight:600}td.a{color:var(--amber-ink);font-weight:600}td.b{color:var(--blue);font-weight:600}td.r{color:var(--red);font-weight:600}
.minibar{display:inline-flex;width:96px;height:8px;border-radius:4px;overflow:hidden;background:var(--surface);vertical-align:middle}
.minibar i{display:block;height:100%}
.pct{display:inline-block;width:38px;text-align:right;font-size:12px;color:var(--muted);margin-left:8px}
/* у роботі */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,19rem),1fr));gap:12px}
.wcard{background:var(--surface);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.wtop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.wtop .e{font-family:var(--head);font-weight:600;font-size:10px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.wtop h3{margin:4px 0 0;font-family:var(--head);font-weight:600;font-size:16px;line-height:20px;color:var(--ink)}
.wring{width:56px;height:56px;flex:none}
.wnums{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.wnums div{background:var(--surface2);border-radius:8px;padding:8px}
.wnums b{display:block;font-family:var(--head);font-weight:600;font-size:17px}
.wnums span{font-size:10px;color:var(--muted)}
.wbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--surface2)}
.wbar i{display:block;height:100%;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.empty{background:var(--surface);border-radius:10px;padding:18px;color:var(--muted);font-size:14px}
/* по днях */
.chart{position:relative;min-height:220px;margin-bottom:18px}
.chart svg text{font-family:var(--body);font-size:11px;fill:var(--muted)}
.tip{position:absolute;pointer-events:none;background:var(--tip-bg);color:var(--tip-ink);border-radius:8px;padding:7px 10px;font-size:12px;line-height:17px;white-space:nowrap;box-shadow:0 8px 20px rgba(16,28,42,.25);z-index:3}
.tip .d{color:var(--tip-mut)}
.more{appearance:none;font-family:var(--head);font-weight:600;font-size:13px;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);cursor:pointer;margin-top:12px}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:12px}
footer .in-wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:16px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
/* замок */
.lock{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;background:var(--navy);color:#aab6c3;font-size:14px;line-height:21px;padding:0 16px}
.lock img{height:32px}.lock p{max-width:34ch;margin:0}
.reveal{opacity:0;transform:translateY(14px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.reveal.on{opacity:1;transform:none}
@media (max-width:640px){.sizebar{position:static}.logos .br{height:20px}.logos .bv{height:20px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.reveal{opacity:1;transform:none}}

<script>
(async function () {
  const LOGO = document.querySelector('.lock img').src;
  const msg = document.getElementById('lock-msg');
  const b64 = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/').padEnd(Math.ceil(s.length / 4) * 4, '=')), c => c.charCodeAt(0));
  const key = new URLSearchParams(location.hash.slice(1)).get('k');
  if (!key) { msg.textContent = 'Ця сторінка відкривається лише за персональним посиланням від Brevis. Перевірте, що посилання скопійоване повністю.'; return; }
  let D;
  try {
    const raw = b64(document.getElementById('payload').textContent.trim());
    const k = await crypto.subtle.importKey('raw', b64(key), 'AES-GCM', false, ['decrypt']);
    D = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: raw.slice(0, 12)}, k, raw.slice(12))));
  } catch (e) { msg.textContent = 'Посилання недійсне або застаріле. Попросіть у Brevis нове посилання.'; return; }
  render(D, LOGO, 'data:image/png;base64,' + document.getElementById('mark').textContent.trim());
})();

function render(D, LOGO, MARK) {
  const nf = new Intl.NumberFormat('uk-UA');
  const pf = (v, d = 0) => new Intl.NumberFormat('uk-UA', {style: 'percent', maximumFractionDigits: d, minimumFractionDigits: d}).format(v || 0);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dd = s => s ? s.slice(8, 10) + '.' + s.slice(5, 7) : '—';
  const ddy = s => dd(s) + '.' + s.slice(0, 4);
  const WD = ['нд', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'], wd = s => WD[new Date(s + 'T00:00:00Z').getUTCDay()];
  const C = {done: 'var(--green)', ready: 'var(--amber)', work: 'var(--blue)', def: 'var(--red)'};
  const cv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const HEX = {done: cv('--green'), ready: cv('--amber'), work: cv('--blue'), def: cv('--red')};
  const el = (tag, a = {}, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(a)) { if (v == null) continue; if (k === 'class') e.className = v; else if (k === 'style') e.style.cssText = v; else e.setAttribute(k, v); } kids.flat().forEach(c => c != null && e.append(c instanceof Node ? c : document.createTextNode(c))); return e; };
  const NS = 'http://www.w3.org/2000/svg', sv = (t, a = {}) => { const e = document.createElementNS(NS, t); for (const [k, v] of Object.entries(a)) e.setAttribute(k, v); return e; };
  const count = (node, to, fmt = v => nf.format(Math.round(v))) => {
    const tok = node._tok = (node._tok || 0) + 1;
    if (reduce) { node.textContent = fmt(to); node._v = to; return; }
    const from = node._v || 0; node._v = to; const t0 = performance.now(), ms = 1000;
    const st = t => { if (node._tok !== tok) return; const p = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - p, 3); node.textContent = fmt(from + (to - from) * e); if (p < 1) requestAnimationFrame(st); };
    requestAnimationFrame(st);
  };
  const setNum = (node, v, txt) => { node._tok = (node._tok || 0) + 1; node._v = v; node.textContent = txt; };
  const later = f => requestAnimationFrame(() => requestAnimationFrame(f));
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('on'); e.target._show && e.target._show(); io.unobserve(e.target); } }), {threshold: 0.12});
  const reveal = (node, show) => { node.classList.add('reveal'); node._show = show; io.observe(node); return node; };

  const PH = D.photos || {};
  const thumb = (p, cls = 'thumb') => { const src = p.photo && PH[p.photo]; if (src) return el('img', {class: cls, src, alt: '', loading: 'lazy'}); const w = (p.name || '').replace(/[^A-Za-zА-Яа-яІіЇїЄє ]/g, '').trim().split(/\s+/); return el('div', {class: cls + ' ph', 'aria-hidden': 'true'}, ((w[0] || '')[0] || '') + ((w[1] || '')[0] || '')); };
  const brandTitle = D.title || D.brand;
  const app = document.getElementById('app'); app.replaceChildren();

  // ── обкладинка
  const T0 = D.total, passed = T0.received ? T0.shipped / T0.received : 0;
  const statN = [D.batches, T0.received, D.models];
  const statNodes = statN.map(() => el('b', {}, '0')); const passNode = el('b', {}, '0 %');
  app.append(el('section', {class: 'cover'},
    el('img', {class: 'wm', src: MARK, alt: ''}),
    el('div', {class: 'in-wrap'},
      el('div', {class: 'logos'}, el('img', {class: 'bv', src: LOGO, alt: 'Brevis'}), D.logo ? el('img', {class: 'br', src: D.logo, alt: brandTitle}) : el('span', {class: 'eyebrow', style: 'color:#fff'}, brandTitle)),
      el('div', {class: 'eyebrow'}, 'Brevis • ' + brandTitle),
      el('h1', {}, 'Статус замовлень'),
      el('p', {class: 'sub'}, 'Стан вишивки й передач по всіх партіях крою · ' + dd(D.start) + ' – ' + ddy(D.asof)),
      el('div', {class: 'stats'},
        el('div', {class: 'stat'}, statNodes[0], el('span', {}, 'партій крою')),
        el('div', {class: 'stat'}, statNodes[1], el('span', {}, 'шт крою')),
        el('div', {class: 'stat'}, statNodes[2], el('span', {}, 'моделей')),
        el('div', {class: 'stat'}, passNode, el('span', {}, 'уже передано'))),
      el('div', {class: 'asof'}, 'станом на ' + ddy(D.asof)))));
  statNodes.forEach((n, i) => count(n, statN[i])); count(passNode, passed * 100, v => Math.round(v) + ' %');

  // ── розміри
  let size = 'all';
  const sizeNote = el('p', {class: 'sizenote'}, D.has_sizes ? 'Оберіть розмір, щоб побачити цифри тільки по ньому.' : 'Розмірна сітка XS–XL з’явиться тут, щойно ми почнемо фіксувати розміри в партіях. Поки показуємо всі розміри разом.');
  const szBtns = ['all', ...D.sizes].map(s => {
    const b = el('button', {class: 'sz' + (s !== 'all' && !D.has_sizes ? ' soon' : ''), type: 'button', 'aria-pressed': String(s === 'all')}, s === 'all' ? 'Усі розміри' : s);
    b.addEventListener('click', () => {
      if (s !== 'all' && !D.has_sizes) { sizeNote.classList.remove('flash'); void sizeNote.offsetWidth; sizeNote.classList.add('flash'); return; }
      size = s; szBtns.forEach(x => x.setAttribute('aria-pressed', String(x === b))); update();
    });
    return b;
  });
  app.append(el('nav', {class: 'sizebar', 'aria-label': 'Розмір'}, el('div', {class: 'in-wrap'}, el('span', {class: 'lbl'}, 'Розмір:'), szBtns, sizeNote)));

  const main = el('main'); app.append(main);
  const slide = (num, eyebrow, title, lead) => { const inner = el('div', {class: 'in-wrap'}, el('div', {class: 'eyebrow'}, num + ' · ' + eyebrow), el('h2', {}, title), lead ? el('p', {class: 'lead'}, lead) : null); main.append(el('section', {class: 'slide'}, inner)); return inner; };

  // ── дані з урахуванням розміру
  const view = () => {
    const prods = D.products.map(p => {
      if (size === 'all') return p;
      const z = p.sizes[size]; if (!z) return null;
      return {...p, ...z, status: z.queue ? 'work' : z.ready ? 'ready' : 'done'};
    }).filter(Boolean);
    const t = {}; ['received', 'embroidered', 'defects', 'shipped', 'queue', 'ready', 'def_emb', 'def_fabric', 'def_unknown'].forEach(k => t[k] = prods.reduce((s, p) => s + (p[k] || 0), 0));
    return {prods, t};
  };

  // 01 ГОЛОВНЕ
  const s1 = slide('01', 'Головне', 'Головне за ' + dd(D.start) + ' – ' + dd(D.asof), 'Уся кількість — у штуках крою. Кольори однакові на всій сторінці.');
  const K = [['done', 'Передано', 'shipped'], ['ready', 'Готово, чекає передачі', 'ready'], ['work', 'У роботі', 'queue'], ['def', 'Брак', 'defects']];
  const kNodes = {}, kSubs = {};
  const kpis = el('div', {class: 'kpis'}, K.map(([c, t, f]) => { kNodes[f] = el('div', {class: 'v'}, '0'); kSubs[f] = el('div', {class: 's'}); return el('div', {class: 'kpi', style: `--c:${C[c]};${c === 'ready' ? '--ci:var(--amber-ink)' : ''}`}, el('div', {class: 't'}, t), kNodes[f], kSubs[f]); }));
  const stack = el('div', {class: 'stack', role: 'img', 'aria-label': 'Розподіл крою за статусами'});
  const segs = {}; K.forEach(([c, n, f]) => { segs[f] = el('i', {style: 'background:' + C[c] + ';cursor:pointer', title: n}); segs[f].addEventListener('click', () => { if (sel2 !== f) pickStatus(f, true); else donut.scrollIntoView({behavior: 'smooth', block: 'center'}); }); stack.append(segs[f]); });
  const legend = el('div', {class: 'legend'}); const summary = el('div', {class: 'summary'});
  s1.append(reveal(el('div', {}, kpis, stack, legend, summary), () => update(true)));

  // 02 ЗАГАЛЬНИЙ СТАН
  const s2 = slide('02', 'Загальний стан', 'Загальний стан крою', null);
  const lead2 = el('p', {class: 'lead'}); s2.append(lead2);
  const donut = sv('svg', {viewBox: '0 0 200 200', class: 'donut', role: 'img', 'aria-label': 'Кругова діаграма статусів'});
  const rows2 = el('div', {class: 'rows'});
  s2.append(reveal(el('div', {class: 'state'}, donut, rows2), () => drawDonut(true)));

  // 03 ЗВЕДЕНА ТАБЛИЦЯ
  const s3 = slide('03', 'Зведена таблиця', 'Скільки прийняли, вишили, передали і скільки браку', 'Один рядок — одна модель. Перший рядок — разом по всіх моделях.');
  let tab = 'all';
  const tabsBox = el('div', {class: 'tabs'});
  const tbody = el('tbody');
  const H = [['Модель', null], ['Прийнято', null], ['Вишито', null], ['Передано', 'done'], ['Готово, чекає', 'ready'], ['У роботі', 'work'], ['Брак', 'def'], ['Готовність', null]];
  s3.append(tabsBox, el('div', {class: 'tablewrap'}, el('table', {}, el('thead', {}, el('tr', {}, H.map(([h, c]) => el('th', {}, c ? el('span', {class: 'dot', style: '--c:' + C[c]}) : null, h)))), tbody)));

  // 04 У РОБОТІ
  const s4 = slide('04', 'У роботі', 'Що зараз у роботі', 'Відкриті моделі. У кільці — скільки крою вже вишито.');
  const cards = el('div', {class: 'cards'}); s4.append(cards);

  // 05 ПО ДНЯХ
  const s5 = slide('05', 'По днях', 'Що робили кожного дня', 'Вишито і передано по днях. Торкніться стовпця, щоб побачити цифри.');
  const chart = el('div', {class: 'chart'});
  const legend5 = el('div', {class: 'legend', style: 'margin-bottom:10px'}, el('span', {}, el('span', {class: 'dot', style: '--c:var(--navy)'}), 'вишито'), el('span', {}, el('span', {class: 'dot', style: '--c:var(--green)'}), 'передано'));
  const dbody = el('tbody'); let allDays = false;
  const moreBtn = el('button', {class: 'more', type: 'button'});
  s5.append(legend5, reveal(chart, () => drawChart(true)), el('div', {class: 'tablewrap'}, el('table', {style: 'min-width:520px'}, el('thead', {}, el('tr', {}, ['Дата', 'Прийнято', 'Вишито', 'Брак', 'Передано'].map((h, i) => el('th', {}, i === 3 ? el('span', {class: 'dot', style: '--c:var(--red)'}) : i === 4 ? el('span', {class: 'dot', style: '--c:var(--green)'}) : null, h)))), dbody)), moreBtn);
  moreBtn.addEventListener('click', () => { allDays = !allDays; drawDays(); });

  app.append(el('footer', {}, el('div', {class: 'in-wrap'}, el('span', {}, 'Brevis × ' + brandTitle + ' · Статус замовлень · станом на ' + ddy(D.asof)), el('span', {}, 'Цифри не збігаються з вашими? Напишіть менеджеру Brevis.'))));

  // ── малювання
  let V = view();
  function update(anim) {
    V = view(); const t = V.t, base = t.shipped + t.ready + t.queue + t.defects || 1;
    K.forEach(([c, , f]) => {
      if (f === 'defects') { count(kNodes[f], t.embroidered ? t.defects / t.embroidered * 100 : 0, v => v.toFixed(2).replace('.', ',') + '%'); }
      else count(kNodes[f], t[f]);
      segs[f].style.width = '0';
    });
    kSubs.shipped.textContent = pf(t.shipped / base) + ' від ' + nf.format(base) + ' шт крою';
    kSubs.ready.textContent = 'вишито, ще не передано';
    kSubs.queue.textContent = 'крій у нас, ще не вишито';
    kSubs.defects.textContent = nf.format(t.defects) + ' шт · вишивка ' + t.def_emb + ' · тканина ' + t.def_fabric + (t.def_unknown ? ' · уточнюється ' + t.def_unknown : '');
    later(() => K.forEach(([, , f]) => { const w = (t[f] / base) * 100; segs[f].style.width = w + '%'; segs[f].textContent = w >= 6 ? Math.round(w) + '%' : ''; }));
    legend.replaceChildren(...K.map(([c, n, f]) => el('span', {}, el('span', {class: 'dot', style: '--c:' + C[c]}), n + ' · ', el('b', {}, nf.format(t[f])))));
    const open = V.prods.filter(p => p.status !== 'done'), closed = V.prods.length - open.length;
    const icon = sv('svg', {width: 18, height: 18, viewBox: '0 0 18 18'}); icon.innerHTML = '<circle cx="9" cy="9" r="8" fill="' + HEX.done + '"/><path d="M5 9.2l2.6 2.6L13 6.4" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>';
    summary.replaceChildren(icon, el('div', {}, el('b', {}, closed + ' з ' + V.prods.length + ' моделей закрито'), ' — усе вишите передано. ',
      open.length ? 'Відкриті: ' + open.slice(0, 4).map(p => p.name + ' (' + nf.format(p.ready + p.queue) + ' шт)').join(', ') + (open.length > 4 ? ' та ще ' + (open.length - 4) : '') + '.' : 'Відкритих моделей немає.'));
    lead2.textContent = 'Разом крою — ' + nf.format(base) + ' шт · вишито — ' + nf.format(t.embroidered) + ' шт · брак — ' + nf.format(t.defects) + ' шт';
    drawDonut(anim); drawTable(); drawCards(); drawChart(false); drawDays();
  }

  let sel2 = null, hov2 = null;
  const LBL = {shipped: 'Передано', ready: 'Готово, чекає передачі', queue: 'У роботі', defects: 'Брак'};
  const CK = {shipped: 'done', ready: 'ready', queue: 'work', defects: 'def'};
  function pickStatus(f, scroll) {
    sel2 = sel2 === f ? null : f; paintDonut();
    if (scroll && sel2) donut.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block: 'center'});
  }
  let segEls = {}, bigT, smT, pctT;
  function drawDonut(anim) {
    const t = V.t, base = t.shipped + t.ready + t.queue + t.defects || 1;
    donut.replaceChildren(); segEls = {};
    const R = 80, W = 26, Cc = 2 * Math.PI * R;
    donut.append(sv('circle', {cx: 100, cy: 100, r: R, fill: 'none', stroke: cv('--track'), 'stroke-width': W}));
    let acc = 0;
    K.forEach(([c, , f], i) => {
      const len = (t[f] / base) * Cc; if (len <= 0) return;
      const shown = Math.max(0.8, len - (len > 3 ? 1.5 : 0));
      const seg = sv('circle', {cx: 100, cy: 100, r: R, fill: 'none', stroke: HEX[c], 'stroke-width': W, transform: `rotate(${-90 + acc / Cc * 360} 100 100)`,
        'stroke-dasharray': anim && !reduce ? `0 ${Cc}` : `${shown} ${Cc}`, tabindex: 0, role: 'button', 'aria-label': LBL[f] + ': ' + nf.format(t[f]) + ' шт'});
      seg.style.cssText = 'cursor:pointer;outline:none;' + (reduce ? '' : `transition:stroke-dasharray .9s cubic-bezier(.2,.8,.2,1) ${i * 0.15}s,stroke-width .25s ease,opacity .25s ease`);
      seg.addEventListener('pointerenter', ev => { if (ev.pointerType === 'mouse') { hov2 = f; paintDonut(); } });
      seg.addEventListener('pointerleave', ev => { if (ev.pointerType === 'mouse') { hov2 = null; paintDonut(); } });
      seg.addEventListener('click', () => pickStatus(f));
      seg.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); pickStatus(f); } });
      donut.append(seg); segEls[f] = seg;
      if (anim && !reduce) later(() => seg.setAttribute('stroke-dasharray', `${shown} ${Cc}`));
      acc += len;
    });
    bigT = sv('text', {x: 100, y: 100, 'text-anchor': 'middle', 'font-family': 'Montserrat, Arial, sans-serif', 'font-weight': 600, 'font-size': 32, fill: cv('--ink'), 'pointer-events': 'none'});
    smT = sv('text', {x: 100, y: 121, 'text-anchor': 'middle', 'font-family': 'IBM Plex Sans, Arial, sans-serif', 'font-size': 12, fill: cv('--muted'), 'pointer-events': 'none'});
    pctT = sv('text', {x: 100, y: 138, 'text-anchor': 'middle', 'font-family': 'IBM Plex Sans, Arial, sans-serif', 'font-size': 11, 'font-weight': 600, fill: cv('--muted'), 'pointer-events': 'none'});
    donut.append(bigT, smT, pctT);
    const desc = {shipped: 'поїхало до вас', ready: 'вишито, чекає передачі', queue: 'ще не вишито', defects: 'вишивка ' + t.def_emb + ' · тканина ' + t.def_fabric + (t.def_unknown ? ' · уточнюється ' + t.def_unknown : '')};
    rows2.replaceChildren(...K.map(([c, n, f]) => {
      const r = el('button', {class: 'rowx', type: 'button', 'data-f': f, 'aria-pressed': 'false'}, el('span', {class: 'dot', style: '--c:' + C[c]}), el('div', {}, el('div', {class: 'n'}, n), el('div', {class: 'd'}, desc[f])), el('div', {class: 'q'}, nf.format(t[f])), el('div', {class: 'p'}, pf(t[f] / base, 1)));
      r.addEventListener('click', () => pickStatus(f));
      r.addEventListener('pointerenter', ev => { if (ev.pointerType === 'mouse') { hov2 = f; paintDonut(); } });
      r.addEventListener('pointerleave', ev => { if (ev.pointerType === 'mouse') { hov2 = null; paintDonut(); } });
      return r;
    }), detail2);
    paintDonut(anim);
  }
  const detail2 = el('div', {class: 'detail', hidden: ''});
  function paintDonut(anim) {
    const t = V.t, base = t.shipped + t.ready + t.queue + t.defects || 1, f = hov2 || sel2;
    Object.entries(segEls).forEach(([k, s]) => { s.setAttribute('stroke-width', k === f ? 36 : 26); s.style.opacity = f && k !== f ? .28 : 1; });
    rows2.querySelectorAll('.rowx').forEach(r => { const on = r.dataset.f === f; r.classList.toggle('on', on); r.classList.toggle('dim', !!f && !on); r.setAttribute('aria-pressed', String(r.dataset.f === sel2)); });
    if (f) { setNum(bigT, t[f], nf.format(t[f])); smT.textContent = ({shipped: 'передано', ready: 'готово, чекає', queue: 'у роботі', defects: 'брак'})[f]; pctT.textContent = pf(t[f] / base, 1) + ' крою'; pctT.setAttribute('fill', HEX[CK[f]]); }
    else { const v = t.shipped / base * 100; smT.textContent = 'передано'; pctT.textContent = 'натисніть'; pctT.setAttribute('fill', cv('--faint')); if (anim) { bigT._v = 0; count(bigT, v, x => Math.round(x) + '%'); } else setNum(bigT, v, Math.round(v) + '%'); }
    const g = sel2 || hov2;
    if (!g) { detail2.hidden = true; detail2._k = null; return; }
    const key = g + '|' + !!sel2 + '|' + size; if (detail2._k === key && !detail2.hidden) return; detail2._k = key;
    const list = V.prods.filter(p => p[g] > 0).sort((a, b) => b[g] - a[g]);
    const max = list.length ? list[0][g] : 1;
    detail2.hidden = false;
    detail2.style.setProperty('--c', C[CK[g]]);
    detail2.replaceChildren(...[
      el('div', {class: 'dh'}, el('b', {}, LBL[g]), el('span', {}, list.length + ' ' + (list.length === 1 ? 'модель' : list.length < 5 ? 'моделі' : 'моделей') + ' · ' + nf.format(t[g]) + ' шт')),
      ...list.slice(0, 8).map((p, i) => { const bar = el('i'); later(() => { bar.style.width = (p[g] / max * 100) + '%'; });
        return el('div', {class: 'di'}, thumb(p), el('span', {class: 'dn'}, p.name), el('span', {class: 'db'}, bar), el('b', {}, nf.format(p[g]))); }),
      list.length > 8 ? el('div', {class: 'dmore'}, '…і ще ' + (list.length - 8) + ' — див. зведену таблицю нижче') : null,
      sel2 ? el('button', {class: 'dclose', type: 'button'}, 'Показати всі статуси') : el('div', {class: 'dmore'}, 'Натисніть, щоб закріпити')].filter(Boolean));
    const cl = detail2.querySelector('.dclose'); if (cl) cl.addEventListener('click', () => pickStatus(sel2));
  }

  function drawTable() {
    const open = V.prods.filter(p => p.status !== 'done');
    const sets = {all: V.prods, open, closed: V.prods.filter(p => p.status === 'done')};
    tabsBox.replaceChildren(...[['all', 'Усі моделі'], ['open', 'Відкриті'], ['closed', 'Закриті']].map(([k, n]) => {
      const b = el('button', {class: 'tab', type: 'button', 'aria-pressed': String(k === tab)}, n + ' · ' + sets[k].length);
      b.addEventListener('click', () => { tab = k; drawTable(); }); return b;
    }));
    const order = {work: 0, ready: 1, done: 2};
    const list = sets[tab].slice().sort((a, b) => order[a.status] - order[b.status] || (b.last_move || '').localeCompare(a.last_move || ''));
    const sum = k => list.reduce((s, p) => s + p[k], 0);
    const cell = (v, cls) => el('td', {class: v ? cls : 'z'}, v ? nf.format(v) : '—');
    const bar = p => { const b = p.shipped + p.ready + p.queue + p.defects || 1; const m = el('span', {class: 'minibar'}); [['shipped', 'done'], ['ready', 'ready'], ['queue', 'work'], ['defects', 'def']].forEach(([f, c]) => m.append(el('i', {style: `width:${p[f] / b * 100}%;background:${C[c]}`}))); return el('td', {}, m, el('span', {class: 'pct'}, pf(p.shipped / b))); };
    const tot = {name: 'Разом', received: sum('received'), embroidered: sum('embroidered'), shipped: sum('shipped'), ready: sum('ready'), queue: sum('queue'), defects: sum('defects')};
    const row = (p, total) => el('tr', {class: total ? 'total' : null},
      el('td', {}, total ? p.name : el('div', {class: 'mcell'}, thumb(p), el('div', {}, p.name, p.first_in ? el('small', {}, 'прихід ' + dd(p.first_in)) : null))),
      el('td', {}, nf.format(p.received)), el('td', {}, nf.format(p.embroidered)),
      cell(p.shipped, 'g'), cell(p.ready, 'a'), cell(p.queue, 'b'), cell(p.defects, 'r'), bar(p));
    tbody.replaceChildren(row(tot, true), ...list.map(p => row(p)));
  }

  function drawCards() {
    const open = V.prods.filter(p => p.status !== 'done').sort((a, b) => (b.ready + b.queue) - (a.ready + a.queue));
    if (!open.length) { cards.replaceChildren(el('div', {class: 'empty'}, 'Зараз усе вишите передано — відкритих моделей немає.')); return; }
    cards.replaceChildren(...open.map(p => {
      const embShare = p.received ? p.embroidered / p.received : 0, Rr = 22, Cc = 2 * Math.PI * Rr;
      const ring = sv('svg', {viewBox: '0 0 56 56', class: 'wring'});
      ring.append(sv('circle', {cx: 28, cy: 28, r: Rr, fill: 'none', stroke: cv('--surface2'), 'stroke-width': 6}));
      const arc = sv('circle', {cx: 28, cy: 28, r: Rr, fill: 'none', stroke: embShare >= 0.95 ? HEX.done : embShare >= 0.5 ? HEX.ready : HEX.work, 'stroke-width': 6, 'stroke-linecap': 'round', transform: 'rotate(-90 28 28)', 'stroke-dasharray': `0 ${Cc}`, style: reduce ? '' : 'transition:stroke-dasharray 1s cubic-bezier(.2,.8,.2,1)'});
      const tx = sv('text', {x: 28, y: 32, 'text-anchor': 'middle', 'font-family': 'Montserrat, Arial', 'font-weight': 600, 'font-size': 12, fill: cv('--ink')}); tx.textContent = Math.round(embShare * 100) + '%';
      ring.append(arc, tx); later(() => arc.setAttribute('stroke-dasharray', `${embShare * Cc} ${Cc}`));
      const b = p.shipped + p.ready + p.queue + p.defects || 1;
      const wbar = el('div', {class: 'wbar'}); const segsW = [['shipped', 'done'], ['ready', 'ready'], ['queue', 'work'], ['defects', 'def']].map(([f, c]) => { const i = el('i', {style: 'background:' + C[c]}); wbar.append(i); return [i, p[f] / b]; });
      later(() => segsW.forEach(([i, w]) => { i.style.width = w * 100 + '%'; }));
      const n = (v, l, col) => el('div', {}, el('b', {style: col ? 'color:' + col : ''}, nf.format(v)), el('span', {}, l));
      return el('div', {class: 'wcard'},
        p.photo && PH[p.photo] ? el('img', {class: 'wphoto', src: PH[p.photo], alt: p.name}) : null,
        el('div', {class: 'wtop'}, el('div', {}, el('div', {class: 'e'}, 'прихід ' + dd(p.first_in)), el('h3', {}, p.name)), ring),
        wbar,
        el('div', {class: 'wnums'}, n(p.received, 'крій'), n(p.shipped, 'передано', 'var(--green)'), n(p.ready, 'готово', 'var(--amber-ink)'), n(p.queue, 'у роботі', 'var(--blue)')));
    }));
  }

  let chartDrawn = false;
  function drawChart(anim) {
    const days = D.days.slice(-24);
    chart.replaceChildren();
    const W = Math.max(300, chart.clientWidth || 600), Hh = 220, m = {t: 10, r: 4, b: 24, l: 38};
    const max = Math.max(1, ...days.map(d => Math.max(d.emb, d.ship)));
    const st = Math.pow(10, Math.floor(Math.log10(max))), top = Math.ceil(max / st) * st;
    const y = v => Hh - m.b - v / top * (Hh - m.t - m.b);
    const svg = sv('svg', {viewBox: `0 0 ${W} ${Hh}`, width: '100%'});
    for (let i = 0; i <= 4; i++) { const v = top * i / 4; svg.append(sv('line', {x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), stroke: cv('--line')})); const tt = sv('text', {x: m.l - 6, y: y(v) + 4, 'text-anchor': 'end'}); tt.textContent = nf.format(v); svg.append(tt); }
    const band = (W - m.l - m.r) / days.length, bw = Math.max(3, Math.min(12, band * 0.3));
    const tip = el('div', {class: 'tip'}); tip.hidden = true;
    const grow = (anim || !chartDrawn) && !reduce && chart.classList.contains('on');
    days.forEach((d, i) => {
      const cx = m.l + band * i + band / 2, g = sv('g', {style: 'cursor:pointer'});
      g.append(sv('rect', {x: cx - band / 2, y: m.t, width: band, height: Hh - m.t - m.b, fill: 'transparent'}));
      [['emb', cv('--emb'), -bw / 2 - 1], ['ship', HEX.done, bw / 2 + 1]].forEach(([k, c, off]) => {
        const r = sv('rect', {x: cx + off - bw / 2, width: bw, rx: 2, fill: c, y: y(0), height: 0});
        const fin = () => { r.setAttribute('y', y(d[k])); r.setAttribute('height', y(0) - y(d[k])); };
        if (grow) { r.style.transition = `y .8s cubic-bezier(.2,.8,.2,1) ${i * 25}ms,height .8s cubic-bezier(.2,.8,.2,1) ${i * 25}ms`; later(fin); } else fin();
        g.append(r);
      });
      if (days.length <= 14 || i % 2 === (days.length - 1) % 2) { const tt = sv('text', {x: cx, y: Hh - 6, 'text-anchor': 'middle'}); tt.textContent = dd(d.day); svg.append(tt); }
      g.addEventListener('pointerenter', () => {
        tip.replaceChildren(el('div', {class: 'd'}, wd(d.day) + ', ' + dd(d.day)), el('div', {}, 'прийнято ' + nf.format(d.inn)), el('div', {}, 'вишито ' + nf.format(d.emb)), el('div', {}, 'передано ' + nf.format(d.ship)), d.defects ? el('div', {}, 'брак ' + nf.format(d.defects)) : null);
        tip.hidden = false; const k = chart.clientWidth / W;
        tip.style.left = Math.max(0, Math.min(chart.clientWidth - tip.offsetWidth, cx * k - tip.offsetWidth / 2)) + 'px';
        tip.style.top = Math.max(0, y(Math.max(d.emb, d.ship)) * k - tip.offsetHeight - 8) + 'px';
      });
      g.addEventListener('pointerleave', () => { tip.hidden = true; });
      svg.append(g);
    });
    chart.append(svg, tip); if (grow) chartDrawn = true;
  }

  function drawDays() {
    const list = D.days.slice().reverse(), shown = allDays ? list : list.slice(0, 14);
    const s = k => shown.reduce((a, d) => a + d[k], 0);
    const c = (v, cls) => el('td', {class: v ? cls : 'z'}, v ? nf.format(v) : '—');
    dbody.replaceChildren(
      el('tr', {class: 'total'}, el('td', {}, 'Разом за ' + shown.length + ' дн.'), el('td', {}, nf.format(s('inn'))), el('td', {}, nf.format(s('emb'))), c(s('defects'), 'r'), c(s('ship'), 'g')),
      ...shown.map(d => el('tr', {}, el('td', {}, dd(d.day), el('small', {}, wd(d.day))), c(d.inn, ''), c(d.emb, ''), c(d.defects, 'r'), c(d.ship, 'g'))));
    moreBtn.textContent = allDays ? 'Показати останні 14 днів' : 'Показати всі дні (' + list.length + ')';
    moreBtn.hidden = list.length <= 14;
  }

  update(false);
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => drawChart(false), 150); });
}
</script>
